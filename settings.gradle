include 'app'

include 'kiwi'
project(':kiwi').projectDir = file('libs/kiwi')

include 'api'
project(':api').projectDir = file('libs/api')

include 'installer'
project(':installer').projectDir = file('libs/installer')

include 'runtime'
project(':runtime').projectDir = file('libs/runtime')

include 'profiles'
project(':profiles').projectDir = file('libs/profiles')

include 'widgets'
project(':widgets').projectDir = file('libs/widgets')

include 'ui-api'
project(':ui-api').projectDir = file('modules/ui-api')

include 'ui'
project(':ui').projectDir = file('modules/ui')

include 'rtui'
project(':rtui').projectDir = file('modules/rtui')

include 'plaf'
project(':plaf').projectDir = file('modules/plaf')

dependencyResolutionManagement {
    repositories {
        // Check if the pipeline explicitly requested Artifactory
        def useArtifactory = System.getenv("USE_ARTIFACTORY") == "true"
        if (useArtifactory) {
            maven {
                url "http://192.168.1.174:8082/artifactory/maven-central-proxy"
                allowInsecureProtocol = true
                credentials {
                    username = providers.gradleProperty("artifactory_user").orNull ?: System.getenv("ARTIFACTORY_USER")
                    password = providers.gradleProperty("artifactory_password").orNull ?: System.getenv("ARTIFACTORY_PASSWORD")
                }
            }
        } else {
            // Fallback for GitHub Actions
            mavenCentral()
        }
    }
}